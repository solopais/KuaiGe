name: Build KuaiGe IPA

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'project.yml'
      - 'KuaiGe.entitlements'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install XcodeGen
        timeout-minutes: 10
        run: |
          set -e
          XCG_VERSION="2.35.0"
          XCG_URL="https://github.com/yonaskolb/XcodeGen/releases/download/${XCG_VERSION}/xcodegen.zip"
          if curl -fSL "$XCG_URL" -o /tmp/xcodegen.zip; then
            mkdir -p /usr/local/bin
            unzip -o /tmp/xcodegen.zip -d /tmp/xcodegen_tmp/
            FOUND=$(find /tmp/xcodegen_tmp -type f -name "xcodegen" | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" /usr/local/bin/xcodegen
              chmod +x /usr/local/bin/xcodegen
              rm -rf /tmp/xcodegen_tmp /tmp/xcodegen.zip
              echo "✅ XcodeGen 二进制安装成功"
              xcodegen version
              exit 0
            fi
          fi
          echo "--- Homebrew 安装 ---"
          brew update --auto-update || true
          brew install xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build .app (unsigned)
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project KuaiGe.xcodeproj \
            -scheme KuaiGe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      # Ad-hoc 签名：不创建证书、不验证链路，秒完成。
      # TrollStore 安装时会用自己的证书重新签名，所以 CI 里只需让 .app 合法即可。
      - name: Ad-hoc sign + inject entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/KuaiGe.app
          codesign --force --deep --sign - --entitlements KuaiGe.entitlements "$APP"
          echo "✅ Ad-hoc 签名完成"

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KuaiGe.app Payload/
          zip -r KuaiGe.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KuaiGe.ipa
          path: KuaiGe.ipa
          compression-level: 0

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: KuaiGe.app
          path: build/Build/Products/Release-iphoneos/KuaiGe.app
          compression-level: 0
