name: KuaiGe
options:
  bundleIdPrefix: com.kuaige
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    URL_CACHE_ENABLED: "NO"

targets:
  KuaiGe:
    type: application
    platform: iOS
    sources:
      - Sources/KuaiGe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kuaige.sniffer
        PRODUCT_NAME: 快歌
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KuaiGe.entitlements
    info:
      path: Resources/Info.plist
    entitlements:
      path: KuaiGe.entitlements
